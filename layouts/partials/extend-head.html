{{/* 转化跟踪：只有配置了 GA4 ID 才注入。
     记录「哪篇笔记 → 点了 GitHub / 邮箱 / 外链」，这是 Search Console 看不到的数据。 */}}
{{ with site.Config.Services.GoogleAnalytics.ID }}
  {{ if hugo.IsProduction }}
<script>
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || typeof gtag !== 'function') return;
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) === '#') return;
    var isMail = href.indexOf('mailto:') === 0;
    var isExternal = /^https?:\/\//.test(href) && href.indexOf(window.location.origin) !== 0;
    if (!isMail && !isExternal) return;
    gtag('event', isMail ? 'contact_email' : 'outbound_click', {
      link_url: href,
      link_text: (a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60),
      page_path: window.location.pathname
    });
  }, true);
</script>
  {{ end }}
{{ end }}

<style>

    body.lg\:px-32 { padding-left: 6rem; padding-right: 6rem; }
  }

  /* 表格观感：边框、表头、内边距 */
  .prose table { width: 100%; border-collapse: collapse; }
  .prose th, .prose td {
    border: 1px solid rgba(128, 128, 128, 0.28);
    padding: 0.6rem 0.8rem;
    vertical-align: top;
    text-align: left;
  }
  .prose th { background: rgba(128, 128, 128, 0.12); font-weight: 600; }
  .prose td { background: transparent; }
</style>
