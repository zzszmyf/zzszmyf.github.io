# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

theme = "congo"
baseURL = "https://zzszmyf.github.io/"
defaultContentLanguage = "zh"
mainSections = ["notes"]
enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]
  page = ["HTML", "markdown"]

# text/markdown 不是 Hugo 内置 media type。页面的 markdown 输出落在 index.md，
# head 里由主题已有的 AlternativeOutputFormats 写成 alternate link。
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    isHTML = false
    rel = "alternate"
    notAlternative = false
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    isHTML = false
    notAlternative = true

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
  # GA4（zzszmyf.github.io 资源）：Congo 主题把 gtag 注入 head，只在 production 构建输出，
  # 本地 hugo server 不上报。注释掉这一行，页面里就不会出现任何统计脚本。
  [services.googleAnalytics]
    ID = "G-4KTMB7LLJJ"
