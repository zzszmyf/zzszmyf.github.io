# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

theme = "congo"
baseURL = "https://zzszmyf.github.io/"
defaultContentLanguage = "zh"
mainSections = ["notes"]
enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
