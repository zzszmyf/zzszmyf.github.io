# -- Markup --

[goldmark]
[goldmark.renderer]
  unsafe = true
[goldmark.extensions]
[goldmark.extensions.passthrough]
  enable = true
[goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]

[highlight]
  noClasses = false
  style = "github-dark"
  lineNos = true
  codeFences = true

[tableOfContents]
  startLevel = 2
  endLevel = 4
