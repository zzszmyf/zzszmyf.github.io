# -- Theme Options --
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "congo"
defaultAppearance = "dark"
autoSwitchAppearance = true

# 全站默认 Open Graph / Twitter 图（static/og.png，1200×630）。
# 页面没有自己的 feature/cover 时，Hugo 的 opengraph / twitter_cards 回退到这里，并输出绝对 URL。
images = ["/og.png"]

defaultThemeColor = "#1a1a1a"

enableSearch = true
enableCodeCopy = true
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  recentLimit = 5

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = true
  showComments = false

[list]
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showTaxonomies = true
  groupByYear = true
  paginationWidth = 1

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true

# 站点验证码先留空，不要填假值。主题 head 只在有内容时输出 meta。
# Google Search Console 的 meta content 填到 google，Bing Webmaster Tools 的填到 bing。
# 已有 HTML 文件验证 static/google1ca7f9297cd42632.html，以及 IndexNow key
# static/2b463038c3a198f501e25601eb316cc4.txt（不是 Bing 的 msvalidate.01）。
[verification]
  # google = ""
  # bing = ""
